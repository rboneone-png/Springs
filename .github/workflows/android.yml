name: Android CI
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      version:
        description: '指定版本號（例如 1.1.0）；留空則自動為最新正式版的修訂號 +1'
        required: false
        default: ''
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[no-release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9, cache-read-only: false }
      - name: Decide version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ver="$INPUT_VERSION"
          elif [ -n "$INPUT_VERSION" ]; then
            echo "版本號格式需為 x.y.z" >&2; exit 1
          else
            # 一般更新：取目前最高的正式版號，修訂號 +1
            last=$(gh release list --limit 200 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease | not) | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("v")] | sort_by(split(".") | map(tonumber)) | last // "1.0.0"')
            IFS=. read -r ma mi pa <<< "$last"
            ver="$ma.$mi.$((pa+1))"
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "pre=false" >> "$GITHUB_OUTPUT"
          echo "版本：$ver"
      - name: Sync drawing engine into app assets
        run: python3 tools/sync_drawing.py
      - run: gradle -PappVersion=${{ steps.v.outputs.ver }} -PbuildNumber=${{ github.run_number }} --build-cache --parallel :app:testDebugUnitTest :app:assembleDebug
      - name: Package web version
        run: |
          cp web/index.html "SpringCalc-web-v${{ steps.v.outputs.ver }}.html"
          (cd web && zip -qr "../SpringCalc-web3d-v${{ steps.v.outputs.ver }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: SpringCalc-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          name: ${{ steps.v.outputs.pre == 'false' && format('彈簧計算器 v{0}（正式版）', steps.v.outputs.ver) || format('v{0}（開發版）', steps.v.outputs.ver) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.v.outputs.pre == 'true' }}
          make_latest: ${{ steps.v.outputs.pre == 'false' }}
          files: |
            app/build/outputs/apk/debug/*.apk
            SpringCalc-web-v${{ steps.v.outputs.ver }}.html
            SpringCalc-web3d-v${{ steps.v.outputs.ver }}.zip
          generate_release_notes: true
