<style>

<body>
<header><h1 id="ttl">彈簧計算器</h1>
<div class="seg" id="useg"><button data-u="m" class="on">公制</button><button data-u="i">英制</button></div></header>
<main id="main">
<section class="panel on" id="p0"></section>
<section class="panel" id="p1"></section>
<section class="panel" id="p2"></section>
<p class="small">本工具為估算用途：疲勞與強度判定依 Shigley/Zimmerli 等教科書做法，非保證值，重要用途請以實測為準。左右滑動可切換彈簧種類。</p>
</main>
<nav id="nav"><button data-t="0" class="on">壓縮</button><button data-t="1">扭力</button><button data-t="2">拉伸</button></nav>

<script id="calc">
/* ===== 計算核心（SI：mm、N、MPa、N·mm） ===== */
const PI=Math.PI;
const MATS=[
 {n:"琴鋼線 (Music wire)",G:79300,E:206000,A:2211,m:.145,steel:true},
 {n:"油回火鋼線",G:77200,E:203400,A:1855,m:.187,steel:true},
 {n:"不鏽鋼 302/304",G:69000,E:193000,A:1867,m:.146,steel:true},
 {n:"磷青銅",G:41400,E:103400,A:932,m:.064,steel:false},
 {n:"鉻矽鋼線",G:77200,E:203400,A:1974,m:.108,steel:true}];
const sut=(m,d)=>m.A/Math.pow(d,m.m);
const ENDS={cg:{n:"閉端磨平",nt:a=>a+2,ls:(a,d)=>(a+2)*d},c:{n:"閉端不磨",nt:a=>a+2,ls:(a,d)=>(a+3)*d},
 o:{n:"開端不磨",nt:a=>a,ls:(a,d)=>(a+1)*d},og:{n:"開端磨平",nt:a=>a+1,ls:(a,d)=>(a+1)*d}};
const wahl=c=>(4*c-1)/(4*c-4)+.615/c;
const shear=(f,D,d)=>wahl(D/d)*8*f*D/(PI*d**3);
const rate=(G,d,D,na)=>G*d**4/(8*D**3*na);
const hookBending=(f,d,D,r1)=>{const c1=Math.max(2*r1/d,1.05);const ka=(4*c1*c1-c1-1)/(4*c1*(c1-1));return f*(ka*16*D/(PI*d**3)+4/(PI*d*d))};
const hookTorsion=(f,d,D,r2)=>{const c2=Math.max(2*r2/d,1.05);return (4*c2-1)/(4*c2-4)*8*f*D/(PI*d**3)};
const strengthShear=(t,s)=>{const r=t/s;return {r,v:r<=.45?0:r<=.65?1:2}};
const strengthBending=(t,s)=>{const r=t/s;return {r,v:r<=.65?0:r<=.78?1:2}};
const VL=["✔ 合格","⚠ 需預壓除應力","✘ 超限"];

function compression(d,od,na,l0,lw,m,end){
 const D=od-d,c=D/d,k=rate(m.G,d,D,na),e=ENDS[end],ls=e.ls(na,d);
 const F=k*(l0-lw),Fs=k*(l0-ls);const w=[];
 if(c<4)w.push("旋繞比 C<4，難以成形");if(c>12)w.push("旋繞比 C>12，易纏繞/不穩定");
 if(l0/D>4)w.push("自由長/中徑 >4，注意挫曲，建議加導桿或導套");
 if(lw<ls)w.push("工作長度小於密合高度");if(lw>l0)w.push("工作長度大於自由長度");
 return {D,c,k,nt:e.nt(na),ls,F,tau:shear(F,D,d),Fs,taus:shear(Fs,D,d),w};
}
function fatigue(tmax,tmin,d,m,peen){
 const S=sut(m,d),ssu=.67*S,ssa=peen?398:241,ssm=peen?534:379;
 const sse=Math.min(ssa/Math.max(1-(ssm/ssu)**2,.05),.5*ssu);
 const tm=(tmax+tmin)/2,ta=(tmax-tmin)/2,w=[];
 if(!m.steel)w.push("疲勞係數以鋼線試驗為基礎，此材質結果僅供參考");
 if(tmax>.45*S)w.push("最大應力超過靜態降伏約 0.45Sut，可能永久變形");
 if(ta<=0)w.push("循環應力幅為 0，無疲勞");
 const ssf=tmax>0?.45*S/tmax:Infinity;
 if(ta<=0||tm>=ssu)return {sut:S,sse,ssf,nf:Infinity,N:ta<=0?Infinity:1e3,below:ta>0,w};
 const nf=.5*(ssu/tm)**2*(ta/sse)*(-1+Math.sqrt(1+(2*tm*sse/(ssu*ta))**2));
 const eq=ta/(1-(tm/ssu)**2),s1=.9*ssu;let N,below=false;
 if(eq>=s1){N=1e3;below=true}else if(eq<=sse)N=Infinity;else N=Math.pow(10,3+4*Math.log(s1/eq)/Math.log(s1/sse));
 return {sut:S,sse,ssf,nf,N,below,w};
}
function fatigueBending(smax,smin,d,m,peen){
 const S=sut(m,d),sr=(peen?.67:.45)*S,se=(sr/2)/(1-(sr/2/S)**2);
 const sm=(smax+smin)/2,sa=(smax-smin)/2,w=[];
 if(!m.steel)w.push("疲勞係數以鋼線試驗為基礎，此材質結果僅供參考");
 if(smax>.78*S)w.push("最大彎曲應力超過建議上限 0.78Sut，可能永久變形");
 if(sa<=0)w.push("循環應力幅為 0，無疲勞");
 const ssf=smax>0?.78*S/smax:Infinity;
 if(sa<=0||sm>=S)return {sut:S,sse:se,ssf,nf:Infinity,N:sa<=0?Infinity:1e3,below:sa>0,w};
 const nf=.5*(S/sm)**2*(sa/se)*(-1+Math.sqrt(1+(2*sm*se/(S*sa))**2));
 const eq=sa/(1-(sm/S)**2),s1=.9*S;let N,below=false;
 if(eq>=s1){N=1e3;below=true}else if(eq<=se)N=Infinity;else N=Math.pow(10,3+3*Math.log(s1/eq)/Math.log(s1/se));
 return {sut:S,sse:se,ssf,nf,N,below,w};
}
function torsion(d,od,nb,l1,l2,ang,arm,m){
 const D=od-d,c=D/d,na=nb+(l1+l2)/(3*PI*D),kd=m.E*d**4/(3667*D*na),M=kd*ang;
 const ki=(4*c*c-c-1)/(4*c*(c-1)),sig=ki*32*M/(PI*d**3);
 const dc=D*nb/(nb+ang/360)+d,w=[];
 if(c<4)w.push("旋繞比 C<4，難以成形");if(c>14)w.push("旋繞比 C>14，不穩定");if(ang/360>nb)w.push("扭轉角過大");
 return {D,c,na,kd,M,F:arm>0?M/arm:0,sig,dc,w};
}
function extension(d,od,na,l0,lw,fi,fmax,m,r1,r2){
 const D=od-d,c=D/d,k=rate(m.G,d,D,na),F=fi+k*(lw-l0),w=[];
 if(c<4)w.push("旋繞比 C<4，難以成形");if(c>12)w.push("旋繞比 C>12，初張力難控制");
 if(lw<l0)w.push("工作長度小於自由長度，無拉力");if(F<fi)w.push("負荷小於初張力，彈簧尚未拉開");
 if(2*r1/d<=1||2*r2/d<=1)w.push("鉤環半徑過小（C1、C2 必須大於 1）");
 const fw=Math.max(F,0);
 return {D,c,k,body:(na+1)*d,F,tau:shear(fw,D,d),taui:shear(fi,D,d),taumax:shear(fmax,D,d),
  hb:hookBending(fw,d,D,r1),ht:hookTorsion(fw,d,D,r2),hbm:hookBending(fmax,d,D,r1),htm:hookTorsion(fmax,d,D,r2),w};
}
function extensionFatigue(d,D,k,l0,lw,lmin,fi,r1,r2,m,peen){
 const fo=l=>fi+k*Math.max(l-l0,0),fM=fo(lw),fm=fo(lmin);
 const body=fatigue(shear(fM,D,d),shear(fm,D,d),d,m,peen);
 const hb=fatigueBending(hookBending(fM,d,D,r1),hookBending(fm,d,D,r1),d,m,peen);
 const ht=fatigue(hookTorsion(fM,d,D,r2),hookTorsion(fm,d,D,r2),d,m,peen);
 const all=[["本體",body],["鉤環彎曲",hb],["鉤側彎扭轉",ht]];
 all.sort((a,b)=>a[1].N-b[1].N||a[1].nf-b[1].nf);
 const w=[...new Set([...body.w,...hb.w,...ht.w])];if(lmin>=lw)w.push("循環最小長度需小於工作長度");
 return {body,hb,ht,N:all[0][1].N,below:all[0][1].below,gov:all[0][0],w};
}
if(typeof module!=="undefined")module.exports={MATS,compression,fatigue,fatigueBending,torsion,extension,extensionFatigue,strengthShear,strengthBending,sut};
</script>

<script id="ui">
/* ===== 介面 ===== */
const $=(s,r=document)=>r.querySelector(s);
const LEN=25.4,FRC=4.4482216,PSI=145.0377;
let imp=false;
const U={get len(){return imp?"in":"mm"},get force(){return imp?"lbf":"N"},get stress(){return imp?"psi":"MPa"},
 get rate(){return imp?"lbf/in":"N/mm"},get tq(){return imp?"lbf·in":"N·mm"},get tqr(){return imp?"lbf·in/°":"N·mm/°"}};
const fac=k=>k==="len"?(imp?LEN:1):k==="force"?(imp?FRC:1):1;
const toSi=(v,k)=>v*fac(k), fromSi=(v,k)=>v/fac(k);
const oLen=v=>imp?v/LEN:v, oF=v=>imp?v/FRC:v, oS=v=>imp?v*PSI:v, oRate=v=>imp?v*LEN/FRC:v, oTq=v=>imp?v/(FRC*LEN):v;
const f=(v,n=2)=>Number.isFinite(v)?v.toFixed(n):"∞";
const clean=v=>String(+v.toFixed(4));
function fmtCycles(n){const e=Math.floor(Math.log10(n)),m=n/10**e;return m.toFixed(1)+"×10"+String(e).replace(/\d/g,x=>"⁰¹²³⁴⁵⁶⁷⁸⁹"[x])}
const life=(N,below,inf)=>!Number.isFinite(N)?inf:below?"< 10³ 次":"約 "+fmtCycles(N)+" 次";
const sRow=(l,s)=>[l,`${f(s.r,2)} <span class="${["ok","caut","fail"][s.v]}">${VL[s.v]}</span>`];
const sWarn=(n,s)=>s.v===2?[n+" 超過材質強度安全範圍"]:[];
function card(title,rows,warns){return `<div class="card"><h3>${title}</h3>${rows.map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")}${warns.map(w=>`<div class="w">⚠ ${w}</div>`).join("")}</div>`}

/* 欄位定義：[id,標籤,類型(len/force/none),預設(公制)] */
const FORMS={
 0:{fields:[["d","線徑 d","len",2],["od","外徑 OD","len",16],["na","有效圈數 Na","none",8],["l0","自由長 L0","len",60]],
    multi:{id:"lw",label:"工作長度 L",kind:"len",def:40,add:"新增工作長度"},
    extra:[["lmax","壽命測試按壓回覆位置（循環最大長度，空白＝自由長）","len",""]],ends:true},
 1:{fields:[["d","線徑 d","len",2],["od","外徑 OD","len",16],["nb","本體圈數 N","none",6],["arm","受力點半徑 R","len",30],["l1","臂長 L1","len",30],["l2","臂長 L2","len",30]],
    multi:{id:"ang",label:"扭轉角 θ",kind:"none",unit:"度",def:90,add:"新增扭轉角"},
    extra:[["amin","壽命測試按壓回覆的位置角度（預載，0＝完全放鬆）","none",0,"度"]]},
 2:{fields:[["d","線徑 d","len",2],["od","外徑 OD","len",16],["na","有效圈數 Na","none",8],["l0","自由長(鉤內) L0","len",60],["fi","初張力 Fi","force",10],["fm","最大負荷","force",200],["r1","鉤環中心半徑 r1","len",7],["r2","鉤側彎半徑 r2","len",4]],
    multi:{id:"lw",label:"工作長度 L",kind:"len",def:80,add:"新增工作長度"},
    extra:[["lmin","壽命測試按壓回覆位置（空白＝自由長，此時負荷＝初張力）","len",""]]}
};
const TITLES=["壓縮彈簧","扭力彈簧","拉伸彈簧"];

/* ---- 參數位置圖（SVG） ---- */
const ar=(id)=>`<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9" fill="none" stroke="var(--pri)" stroke-width="1.6"/></marker></defs>`;
const dm=(id,x1,y1,x2,y2)=>`<line class="d" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-start="url(#${id})" marker-end="url(#${id})"/>`;
const gd=(x1,y1,x2,y2)=>`<line class="g" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const tx=(t,x,y)=>`<text x="${x}" y="${y}">${t}</text>`;
const sec=(x,y)=>`<circle class="l" cx="${x}" cy="${y}" r="9" stroke-width="2"/><circle cx="${x}" cy="${y}" r="1.6" fill="currentColor"/>${tx("d",x,y+22)}`;
function diagram(t){
 if(t===0){const cx=150,h=62,top=85,bot=235,o=h+2.5;let p="";for(let i=0;i<=7;i++)p+=`${i%2?cx+h:cx-h},${top+150*i/7} `;
  return `<svg viewBox="0 0 360 290" color="currentColor">${ar("a0")}
  <line class="l" stroke-width="5" x1="${cx-o}" y1="${top}" x2="${cx+o}" y2="${top}"/><line class="l" stroke-width="5" x1="${cx-o}" y1="${bot}" x2="${cx+o}" y2="${bot}"/>
  <polyline class="l" stroke-width="5" points="${p}"/>
  ${gd(cx+o,top,305,top)}${gd(cx+o,bot,305,bot)}${gd(cx+h,190,260,190)}
  ${dm("a0",295,top,295,bot)}${tx("L0",322,160)}${dm("a0",250,top,250,190)}${tx("L",270,138)}
  ${gd(cx-o,28,cx-o,top)}${gd(cx+o,28,cx+o,top)}${dm("a0",cx-o,28,cx+o,28)}${tx("OD",cx,46)}
  ${gd(cx-h,bot,cx-h,268)}${gd(cx+h,bot,cx+h,268)}${dm("a0",cx-h,268,cx+h,268)}${tx("D",cx+h+16,268)}${sec(30,145)}</svg>`}
 if(t===1){const cx=130,cy=165,r=72,wr=12,rm=r-wr/2,a=50*PI/180,p2=[cx+rm*Math.cos(a),cy-rm*Math.sin(a)],dr=[-Math.sin(a),-Math.cos(a)];
  const t1=[cx+rm,cy-145],fy=cy-(145*.8),t2=[p2[0]+dr[0]*95,p2[1]+dr[1]*95];
  const ax=cx+rm,arcR=44,s=-140*PI/180,e=-90*PI/180;
  return `<svg viewBox="0 0 360 330" color="currentColor">${ar("a1")}
  <circle class="l" stroke-width="2" cx="${cx}" cy="${cy}" r="${r}"/><circle class="l" stroke-width="2" cx="${cx}" cy="${cy}" r="${r-wr}"/>
  <circle class="g" cx="${cx}" cy="${cy}" r="${rm}"/>
  <line class="l" stroke-width="${wr}" stroke-linecap="butt" x1="${ax}" y1="${cy}" x2="${t1[0]}" y2="${t1[1]}"/>
  <line class="l" stroke-width="${wr}" stroke-linecap="butt" x1="${p2[0]}" y1="${p2[1]}" x2="${t2[0]}" y2="${t2[1]}"/>
  ${tx("L2",t2[0]+dr[0]*16,t2[1]+dr[1]*16)}
  ${gd(ax,cy,ax+dr[0]*95,cy+dr[1]*95)}
  <path class="d" d="M${ax+arcR*Math.cos(s)},${cy+arcR*Math.sin(s)} A${arcR},${arcR} 0 0 1 ${ax},${cy-arcR}"/>${tx("θ",ax-30,cy-70)}
  ${gd(ax,t1[1],ax+58,t1[1])}${dm("a1",ax+52,cy,ax+52,t1[1])}${tx("L1",ax+72,(cy+t1[1])/2)}
  ${gd(ax,fy,ax+34,fy)}${dm("a1",ax+28,cy,ax+28,fy)}${tx("R",ax+42,(cy+fy)/2+14)}
  <line class="d" x1="${ax-48}" y1="${fy}" x2="${ax-6}" y2="${fy}" marker-end="url(#a1)"/>${tx("F",ax-58,fy)}
  ${dm("a1",cx-r,cy+r+22,cx+r,cy+r+22)}${tx("OD",cx+r+20,cy+r+22)}${dm("a1",cx-rm,cy+r+44,cx+rm,cy+r+44)}${tx("D",cx+rm+16,cy+r+44)}${sec(28,cy)}</svg>`}
 return `<div class="seg hkseg"><button data-hk="0" class="on">圓環鉤</button><button data-hk="1">長開口鉤</button></div><div class="hk" data-h="0">${extLoop()}</div><div class="hk" data-h="1" hidden>${extOpen()}</div>`;
}
function extLoop(){
 const cx=150,h=40,hr=24,rr=h-hr,y1=100,y2=210,n=10;let b="";for(let i=0;i<n;i++){const y=y1+(y2-y1)/n*i;b+=`<line class="l" stroke-width="4" x1="${cx-h}" y1="${y+6}" x2="${cx+h}" y2="${y+1+(y2-y1)/n*.5}"/>`}
 const topIn=y1-2*hr,botIn=y2+2*hr;
 return `<svg viewBox="0 0 360 590" color="currentColor">${ar("a2")}${b}
  <circle class="l" stroke-width="5" cx="${cx}" cy="${y1-hr}" r="${hr}"/><circle class="l" stroke-width="5" cx="${cx}" cy="${y2+hr}" r="${hr}"/>
